# config.properties  ·  va en la RAIZ de src/, al lado de Concurso.java.
#
# Configuracion del concurso de la Practica 0.
#
# El evaluador lo busca en el CLASSPATH, o sea en bin/, asi que este archivo tiene
# que estar en la raiz de src/ para que Eclipse lo copie. Si no, el programa muere
# con "property file 'config.properties' not found in the classpath".

# Partidas por emparejamiento. Son 21x21 = 441 emparejamientos, asi que esto
# multiplica MUCHO: son 441 x trials partidas en total, y 21 x trials por cada
# controlador.
#
#    trials = 10   ->   4.410 partidas, un par de minutos. El error tipico se
#                       queda en unos +/-80, que es mas que la distancia entre
#                       los primeros: el orden de arriba es medio azar.
#    trials = 100  ->  44.100 partidas, media hora larga. El error tipico baja
#                       a la raiz de diez, o sea a un tercio: ya se puede leer.
#    trials = 300  -> 132.300 partidas. Lo que usa la competicion de verdad.
#
# Lanzarlo dos veces con 10 y ver como cambia el orden, y luego una vez con 100
# y ver como se queda quieto, es el ejercicio entero.
trials = 100

# Sin visibilidad parcial, como en la Practica 0 y en la Practica 1.
po = false

# Turnos maximos por partida y plazo anunciado en timeDue.
ticks = 4000
time = 40

