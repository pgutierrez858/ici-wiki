# Publica la wiki en GitHub Pages.
#
# El sitio es la carpeta wiki/: HTML estático, sin build. Este flujo la sube
# tal cual cada vez que se empuja a main.
#
# Una vez, al crear el repositorio, hay que dejar en
# Settings > Pages > Build and deployment la fuente en «GitHub Actions»:
# el GITHUB_TOKEN no puede crear el sitio por su cuenta.

name: Publicar la wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro empujón, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          # Si Pages ya está activado, esto no hace nada; si se desactivara,
          # lo intenta reactivar.
          enablement: true

      - name: Empaquetar la carpeta wiki
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
