# Publica la wiki en GitHub Pages.
#
# El sitio es la carpeta wiki/: HTML estático, sin build. Este flujo la sube
# tal cual cada vez que se empuja a main.
#
# La primera ejecución activa Pages ella misma (enablement: true), así que no
# hay que tocar nada en Settings > Pages.

name: Publicar la wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro empujón, se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          # Si Pages todavía no está activado en el repositorio, lo activa
          # este paso: no hace falta tocar nada en Settings.
          enablement: true

      - name: Empaquetar la carpeta wiki
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
